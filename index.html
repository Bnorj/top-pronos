<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D9F4F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Top Pronos">
  <meta name="description" content="Pronostics football du jour, tickets et scores — tous les championnats.">
  <title>Top Pronos — Top Tip IA</title>
  <base href="/top-pronos/">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="28" height="28">
        <span>Top Pronos</span>
      </div>
      <button class="icon-btn" id="btn-search" aria-label="Rechercher" title="Rechercher">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-filter" aria-label="Filtrer par championnat" title="Filtrer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
      <button class="icon-btn" id="btn-cal" aria-label="Calendrier" title="Calendrier">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      </button>
    </div>
    <div class="date-bar">
      <span id="date-label">Chargement…</span>
      <span class="live-chip" id="live-count" hidden><span class="pulse"></span><span id="live-count-txt"></span></span>
    </div>
    <div class="search-bar" id="search-bar">
      <input id="search-input" type="search" placeholder="Équipe, championnat, pays…" autocomplete="off">
    </div>
    <div class="filter-bar" id="filter-bar">
      <div class="filter-chips" id="filter-chips"></div>
    </div>
  </header>

  <main class="main" id="main"></main>

  <nav class="nav" aria-label="Navigation">
    <button class="nav-item active" data-tab="tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l2.4 6.8H21l-5.4 4.1 2.1 6.6L12 16.9 6.3 20.5l2.1-6.6L3 9.8h6.6L12 3z"/></svg>
      Top Tip
    </button>
    <button class="nav-item" data-tab="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Tous
    </button>
    <button class="nav-item" data-tab="live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      En direct
    </button>
    <button class="nav-item" data-tab="tickets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9a2 2 0 0 0 2-2V6a2 2 0 0 1 2-2h14v16H7a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2"/><path d="M15 6v12"/></svg>
      Tickets
    </button>
    <button class="nav-item" data-tab="fav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 18l-6.2 3.2 1.2-7L2 9.3l7.1-1L12 2l2.9 6.3 7.1 1-5 4.9 1.2 7z"/></svg>
      Favoris
    </button>
  </nav>

  <div class="modal" id="cal-modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="cal-title">
      <button class="close-sheet" id="cal-close" aria-label="Fermer">×</button>
      <h2 id="cal-title">Choisir une date</h2>
      <div id="cal-body"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
